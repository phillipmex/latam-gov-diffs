[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govdiff"
version = "0.1.0"
description = "Nightly snapshots and machine-readable diffs of Latin American government reference data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "latam-gov-diffs maintainers" }]
keywords = ["nfe", "cclasstrib", "sat", "cfdi", "diff", "open-data", "brazil", "mexico"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "requests>=2.32",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
govdiff = "govdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
