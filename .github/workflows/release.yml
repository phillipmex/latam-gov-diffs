name: release

# Publishes both clients when a `v*` tag is pushed: the Python package to PyPI
# and the thin Node client to npm.
#
# There are no API tokens anywhere in this file, and none in the repository
# secrets. Both registries are published to with **trusted publishing**: the
# job asks GitHub for a short-lived OIDC identity token, and the registry
# checks that the identity (owner, repository, workflow file, environment)
# matches a publisher the owner registered once by hand. A leaked repository
# secret is then not a thing that can exist, because there is no secret.
#
# That does mean the two publishers must be registered before the first tag,
# and the details must match exactly:
#
#   PyPI  - project govdiff, owner phillipmex, repository latam-gov-diffs,
#           workflow release.yml, environment pypi
#   npm   - package govdiff, owner phillipmex, repository latam-gov-diffs,
#           workflow release.yml, environment npm
#
# The release order is deliberate: PyPI first, npm second and only if PyPI
# succeeded. The npm client is a reader of the archive and is worth nothing on
# its own; the Python package is the thing that fills the archive.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for trusted publishing. Nothing else is granted.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: Confirm the archive is not in the sdist
        # The package is the tool; the repository is the archive. A release
        # that shipped data/ or diffs/ would be tens of megabytes and would
        # grow every night.
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          banned = ("data", "diffs", "raw", "docs", ".state", "js")
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          # Every name is "<name>-<version>/<path inside the sdist>".
          inside = [n.split("/", 1)[1] for n in names if "/" in n]
          leaked = sorted({p for p in inside for b in banned if p == b or p.startswith(b + "/")})
          if leaked:
              print("archive directories leaked into the sdist:", leaked)
              sys.exit(1)
          print("sdist holds the tool only: %d entries" % len(names))
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    needs: pypi
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that can do trusted publishing
        # OIDC publishing and --provenance need npm >= 11.5.1. Node 24 ships a
        # new enough npm today; this pins the guarantee rather than assuming it.
        run: npm install -g npm@latest

      - name: Test
        run: npm test

      - name: Check the package contents
        run: npm pack --dry-run

      - name: Publish
        # No NODE_AUTH_TOKEN: the identity comes from the OIDC token above.
        run: npm publish --provenance --access public
